name: Deploy CI/CD to LMS Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.LMS_STAGING_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.LMS_STAGING_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          script: |
            set -x
            cd /home/frappe/ba-bench/apps/one_fm_google_integration
            git pull upstream staging
            cd /home/frappe/ba-bench
            bench setup requirements one_fm_google_integration
            bench migrate
            bench build --app one_fm_google_integration
            bench clear-cache
            bench restart
